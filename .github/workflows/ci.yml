# 🧬 #龍芯⚡️丙午·己亥·壬辰·癸卯·䷟恒-代码-创建-gadic-ci-20261114

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 安装依赖（pytest + cryptography）
        run: python -m pip install --upgrade pip && python -m pip install cryptography pytest

      - name: 环境体检（annotation 直出，未登录可见）
        run: |
          echo "::error::PY=$(python --version 2>&1) CWD=$(pwd) TESTS=$(ls tests/ | tr '\n' ' ')"
          echo "::error::IMPORT_GPROV=$(PYTHONPATH=src python -c 'import gprov; print("OK", gprov.__file__)' 2>&1 | tail -1)"

      - name: 测试全绿（基线 22 用例）
        run: |
          set -o pipefail
          python -m pytest tests/ -q 2>&1 | tee pytest-output.log || {
            ERR=$(tail -25 pytest-output.log | tr '\n' '|' | tr '%' ' ')
            echo "::error::PYTEST_TAIL:: $ERR"
            exit 1
          }

      - name: 完整性自校验（SHA-256 清单）
        run: sha256sum -c SHA256SUMS.sha256

      - name: 端到端独立验证
        run: |
          set -o pipefail
          PYTHONPATH=src python3 -m gprov.cli.cli verify \
            ./examples/synthetic/work-001.txt ./evidence/record-001 \
            --trust-policy ./config/trust-policy.json 2>&1 | tee verify-output.log || {
            ERR=$(tail -25 verify-output.log | tr '\n' '|' | tr '%' ' ')
            echo "::error::VERIFY_TAIL:: $ERR"
            exit 1
          }

      - name: 溯源标记检查（每个源文件须带出身证明）
        run: python scripts/check_dna.py
